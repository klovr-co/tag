name: Install smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: ${{ matrix.os }} clean install
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v10
      - name: Install and verify without credentials
        shell: bash
        run: |
          export XDG_BIN_HOME="$RUNNER_TEMP/tag-bin"
          export PATH="$XDG_BIN_HOME:$HOME/.local/bin:$PATH"
          ./install.sh --dependencies-only
          ./install.sh --check-dependencies
          ./tag version
          OPENTAG_ENV_FILE=/dev/null \
            OPENTAG_TRANSPORT=slack \
            OPENTAG_BACKEND=codex \
            OPENTAG_WORKDIR="$PWD" \
            MFS_URL=http://127.0.0.1:13619 \
            MFS_ALLOWED_SCOPES="file://local$PWD" \
            ./tag doctor --offline
