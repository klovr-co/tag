display_information:
  name: OpenMax
  description: Run approved Codex or Claude tasks from Slack.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: OpenMax
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - canvases:write
      - chat:write
      - files:read
      - groups:history
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
